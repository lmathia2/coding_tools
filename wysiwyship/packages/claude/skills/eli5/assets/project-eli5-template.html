<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src data:">
  <link rel="icon" href="data:,">
  <title>Project ELI5</title>
  <style>
    /* === THEME === */
    :root {
      --ink: #17202a;
      --paper: #f5f0e6;
      --paper-deep: #e9dfce;
      --night: #111923;
      --muted: #66717e;
      --coral: #ff6b55;
      --mint: #45d6ad;
      --gold: #f6c85f;
      --sky: #79bff5;
      --violet: #a78bfa;
      --accent: var(--coral);
      --display: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      --body: "Avenir Next", Avenir, "Trebuchet MS", sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --ease: cubic-bezier(.16, 1, .3, 1);
      --stage-bg: #090e14;
      --slide-bg: var(--paper);
    }

    /* === RESET AND FIXED 16:9 STAGE === */
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg); }
    body { color: var(--ink); font-family: var(--body); }
    .deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg); }
    .deck-stage {
      position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden;
      transform-origin: 0 0; background: var(--slide-bg);
    }
    .slide {
      position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
      display: block; visibility: hidden; opacity: 0; pointer-events: none;
      background: var(--paper); transition: opacity 320ms ease;
    }
    .slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }

    /* === ATMOSPHERE === */
    .slide::before {
      content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .72;
      background:
        radial-gradient(circle at 88% 8%, color-mix(in srgb, var(--accent) 23%, transparent) 0 12%, transparent 32%),
        linear-gradient(90deg, rgba(23, 32, 42, .045) 1px, transparent 1px),
        linear-gradient(rgba(23, 32, 42, .045) 1px, transparent 1px);
      background-size: auto, 48px 48px, 48px 48px;
    }
    .slide::after {
      content: ""; position: absolute; width: 520px; height: 520px; right: -250px; bottom: -280px;
      border: 3px solid var(--accent); border-radius: 50%; opacity: .38;
    }
    .theme-coral { --accent: var(--coral); }
    .theme-mint { --accent: var(--mint); }
    .theme-gold { --accent: var(--gold); }
    .theme-sky { --accent: var(--sky); }
    .theme-violet { --accent: var(--violet); }

    /* === SHARED SLIDE LAYOUT === */
    .frame { position: relative; z-index: 2; height: 100%; padding: 76px 92px 72px; display: flex; flex-direction: column; }
    .topline { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
    .eyebrow { font: 700 22px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; }
    .eyebrow::before { content: ""; display: inline-block; width: 42px; height: 6px; margin: 0 16px 4px 0; background: var(--accent); }
    .page { font: 700 22px/1 var(--mono); color: var(--muted); }
    .layout { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 86px; flex: 1; align-items: center; padding-top: 42px; min-height: 0; }
    .copy, .visual { min-width: 0; }
    h1, h2, p { margin: 0; }
    h2 { max-width: 780px; font: 650 82px/.98 var(--display); letter-spacing: -.045em; }
    .body { max-width: 760px; margin-top: 34px; font-size: 30px; line-height: 1.42; color: #34414e; }
    .accent-rule { width: 122px; height: 9px; margin-top: 42px; background: var(--accent); }

    /* === STRUCTURED VISUALS === */
    .bullet-stack { display: grid; gap: 18px; }
    .bullet {
      position: relative; padding: 22px 24px 22px 72px; border: 2px solid rgba(23, 32, 42, .12);
      background: rgba(255,255,255,.56); font-size: 27px; line-height: 1.3; box-shadow: 8px 8px 0 color-mix(in srgb, var(--accent) 30%, transparent);
    }
    .bullet::before { content: ""; position: absolute; left: 24px; top: 27px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); }
    .card-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
    .card {
      position: relative; min-height: 210px; padding: 28px; border: 2px solid var(--ink);
      background: rgba(255,255,255,.7); box-shadow: 12px 12px 0 color-mix(in srgb, var(--accent) 55%, transparent);
    }
    .card-tag { display: inline-block; min-width: 36px; margin-bottom: 24px; padding: 7px 10px; background: var(--accent); font: 800 17px/1 var(--mono); text-align: center; }
    .card h3 { margin: 0 0 13px; font: 650 31px/1.08 var(--display); }
    .card p { font-size: 22px; line-height: 1.35; color: #44515f; }
    .flow-list { display: grid; gap: 17px; }
    .flow-step {
      position: relative; display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 20px;
      min-height: 112px; padding: 20px 24px; border-left: 8px solid var(--accent); background: rgba(255,255,255,.7);
    }
    .flow-step:not(:last-child)::after {
      content: "↓"; position: absolute; left: 20px; bottom: -25px; z-index: 2;
      width: 32px; color: var(--ink); background: var(--paper); font: 800 24px/1 var(--mono); text-align: center;
    }
    .flow-index { padding-top: 4px; font: 800 19px/1 var(--mono); color: var(--muted); }
    .flow-copy h3 { margin: 0; font: 650 28px/1.05 var(--display); }
    .flow-copy p { margin-top: 8px; font-size: 20px; line-height: 1.25; color: #44515f; }
    .flow-path { margin-top: 10px; font: 700 16px/1.2 var(--mono); color: #485665; overflow-wrap: anywhere; }
    .metric-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
    .metric { min-height: 210px; padding: 30px; background: var(--night); color: var(--paper); border-top: 12px solid var(--accent); }
    .metric-value { font: 650 70px/.95 var(--display); color: var(--accent); }
    .metric-label { margin-top: 15px; font-size: 24px; font-weight: 750; }
    .metric-detail { margin-top: 10px; font-size: 19px; color: #b9c1ca; }
    .analogy { padding: 34px 38px; border-left: 12px solid var(--accent); background: var(--night); color: var(--paper); }
    .analogy-label { font: 800 17px/1 var(--mono); letter-spacing: .12em; color: var(--accent); }
    .analogy h3 { margin: 17px 0 14px; font: 650 36px/1.1 var(--display); }
    .analogy p { font-size: 24px; line-height: 1.38; color: #d9dee3; }
    .boundary { margin-top: 20px; padding-top: 18px; border-top: 1px solid #48515b; font-size: 19px !important; color: #abb5bf !important; }
    pre { max-height: 470px; overflow: hidden; margin: 0; padding: 34px; border-radius: 0; background: var(--night); color: #e9f0f4; font: 21px/1.45 var(--mono); border-left: 12px solid var(--accent); white-space: pre-wrap; }
    .evidence-block { margin-top: 26px; }
    .evidence-label { font: 800 15px/1 var(--mono); letter-spacing: .12em; color: var(--muted); }
    .evidence-list { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 11px; }
    .evidence-chip { padding: 8px 11px; background: rgba(23, 32, 42, .08); font: 700 15px/1.15 var(--mono); overflow-wrap: anywhere; }

    /* === TITLE AND CLOSING === */
    .title-slide { background: var(--night); color: var(--paper); }
    .title-slide::before { opacity: .5; background: radial-gradient(circle at 76% 42%, color-mix(in srgb, var(--accent) 55%, transparent), transparent 31%), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px); background-size: auto, 54px 54px, 54px 54px; }
    .title-layout { display: grid; grid-template-columns: 1.2fr .8fr; gap: 70px; align-items: center; height: 100%; }
    .kicker { font: 800 22px/1 var(--mono); letter-spacing: .16em; color: var(--accent); text-transform: uppercase; }
    h1 { max-width: 1120px; margin-top: 30px; font: 650 124px/.9 var(--display); letter-spacing: -.055em; }
    .subtitle { max-width: 950px; margin-top: 34px; font-size: 32px; line-height: 1.35; color: #c9d0d7; }
    .audience { display: inline-flex; margin-top: 42px; padding: 13px 18px; border: 1px solid #52606e; font: 700 18px/1 var(--mono); color: #d7dde3; }
    .orb { position: relative; width: 520px; height: 520px; border: 3px solid var(--accent); border-radius: 50%; }
    .orb::before, .orb::after { content: ""; position: absolute; border-radius: 50%; }
    .orb::before { inset: 54px; background: var(--accent); opacity: .88; }
    .orb::after { inset: 137px; border: 3px solid var(--night); box-shadow: 0 0 0 34px rgba(17,25,35,.2); }
    .closing-slide { background: var(--paper-deep); }
    .closing-layout { display: grid; grid-template-columns: 1.05fr .95fr; gap: 90px; align-items: center; height: 100%; }
    .closing-title { font: 650 100px/.94 var(--display); letter-spacing: -.05em; }
    .next-list { display: grid; gap: 18px; margin-top: 34px; }

    /* === REVEALS AND CONTROLS === */
    .reveal { opacity: 0; transform: translateY(28px); transition: opacity 620ms var(--ease), transform 620ms var(--ease); }
    .visible .reveal { opacity: 1; transform: translateY(0); }
    .visible .reveal:nth-child(2) { transition-delay: 90ms; }
    .visible .reveal:nth-child(3) { transition-delay: 180ms; }
    .visible .reveal:nth-child(4) { transition-delay: 270ms; }
    .deck-controls { position: fixed; left: 50%; bottom: 20px; z-index: 20; transform: translateX(-50%); display: flex; align-items: center; gap: 13px; padding: 9px 12px; border: 1px solid #46515c; background: rgba(10,15,21,.9); color: white; backdrop-filter: blur(10px); }
    .deck-controls button { width: 42px; height: 34px; border: 0; background: #202b36; color: white; font-size: 20px; cursor: pointer; }
    .deck-controls button:hover, .deck-controls button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .counter { min-width: 76px; font: 700 15px/1 var(--mono); text-align: center; }
    .progress { position: fixed; left: 0; bottom: 0; z-index: 30; height: 5px; width: 0; background: var(--coral); transition: width 260ms ease; }

    /* === PRINT AND ACCESSIBILITY === */
    @media print {
      html, body { width: 1920px; height: auto; overflow: visible; background: #fff; }
      .deck-viewport { position: static; overflow: visible; }
      .deck-stage { position: static; width: auto; height: auto; transform: none !important; }
      .slide { position: relative; display: block !important; visibility: visible !important; opacity: 1 !important; pointer-events: auto !important; width: 1920px; height: 1080px; break-after: page; }
      .slide:last-child { break-after: auto; }
      .deck-controls, .progress { display: none !important; }
      .reveal { opacity: 1 !important; transform: none !important; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      .reveal { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="deck-viewport">
    <main class="deck-stage" id="deckStage" aria-live="polite"></main>
  </div>
  <nav class="deck-controls" aria-label="Slide controls">
    <button id="previous" type="button" aria-label="Previous slide">←</button>
    <span class="counter" id="counter">1 / 1</span>
    <button id="next" type="button" aria-label="Next slide">→</button>
  </nav>
  <div class="progress" id="progress" aria-hidden="true"></div>
  <script id="story-data" type="application/json">__STORY_DATA__</script>
  <script>
    /* === SAFE DOM HELPERS === */
    const story = JSON.parse(document.getElementById('story-data').textContent);
    const stage = document.getElementById('deckStage');
    const accents = ['coral', 'mint', 'gold', 'sky', 'violet'];
    const node = (tag, className, text) => {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined && text !== null) element.textContent = text;
      return element;
    };
    const add = (parent, child) => { if (child) parent.appendChild(child); return child; };

    /* === CONTENT BUILDERS === */
    function bullets(values, className = 'bullet-stack') {
      if (!values || !values.length) return null;
      const list = node('div', className);
      values.forEach(value => add(list, node('div', 'bullet reveal', value)));
      return list;
    }

    function cards(values) {
      if (!values || !values.length) return null;
      const grid = node('div', 'card-grid');
      values.forEach((value, index) => {
        const card = add(grid, node('article', 'card reveal'));
        add(card, node('span', 'card-tag', value.tag || String(index + 1).padStart(2, '0')));
        add(card, node('h3', '', value.title));
        add(card, node('p', '', value.body || ''));
      });
      return grid;
    }

    function metrics(values) {
      if (!values || !values.length) return null;
      const grid = node('div', 'metric-grid');
      values.forEach(value => {
        const metric = add(grid, node('article', 'metric reveal'));
        add(metric, node('div', 'metric-value', value.value));
        add(metric, node('div', 'metric-label', value.label || ''));
        if (value.detail) add(metric, node('div', 'metric-detail', value.detail));
      });
      return grid;
    }

    function analogy(value) {
      if (!value) return null;
      const panel = node('aside', 'analogy reveal');
      add(panel, node('div', 'analogy-label', 'THINK OF IT LIKE THIS'));
      add(panel, node('h3', '', value.title));
      add(panel, node('p', '', value.body));
      if (value.boundary) add(panel, node('p', 'boundary', `Where the analogy stops: ${value.boundary}`));
      return panel;
    }

    function flow(values) {
      if (!values || !values.length) return null;
      const list = node('div', 'flow-list');
      values.forEach((value, index) => {
        const step = add(list, node('article', 'flow-step reveal'));
        add(step, node('div', 'flow-index', String(index + 1).padStart(2, '0')));
        const copy = add(step, node('div', 'flow-copy'));
        add(copy, node('h3', '', value.title));
        add(copy, node('p', '', value.body));
        if (value.path) add(copy, node('div', 'flow-path', value.path));
      });
      return list;
    }

    function evidence(values) {
      if (!values || !values.length) return null;
      const block = node('aside', 'evidence-block reveal');
      add(block, node('div', 'evidence-label', 'INSPECTED EVIDENCE'));
      const list = add(block, node('div', 'evidence-list'));
      values.forEach(value => add(list, node('span', 'evidence-chip', value)));
      return block;
    }

    function visualFor(slide) {
      return flow(slide.flow) || cards(slide.items) || metrics(slide.metrics) || analogy(slide.analogy) || bullets(slide.bullets) || (slide.code ? node('pre', 'reveal', slide.code) : null);
    }

    /* === SLIDE BUILDERS === */
    function titleSlide() {
      const section = node('section', 'slide title-slide theme-coral');
      section.setAttribute('aria-label', `Title: ${story.title}`);
      const frame = add(section, node('div', 'frame'));
      const layout = add(frame, node('div', 'title-layout'));
      const copy = add(layout, node('div', ''));
      add(copy, node('div', 'kicker reveal', 'PROJECT ELI5'));
      add(copy, node('h1', 'reveal', story.title));
      add(copy, node('p', 'subtitle reveal', story.subtitle || story.summary));
      add(copy, node('div', 'audience reveal', `For: ${story.audience || 'a curious developer'}`));
      add(layout, node('div', 'orb reveal'));
      return section;
    }

    function contentSlide(value, index, total) {
      const accent = value.accent || accents[index % accents.length];
      const section = node('section', `slide theme-${accent}`);
      section.setAttribute('aria-label', value.title);
      const frame = add(section, node('div', 'frame'));
      const top = add(frame, node('header', 'topline'));
      add(top, node('div', 'eyebrow', value.eyebrow || 'THE STORY'));
      add(top, node('div', 'page', `${String(index + 2).padStart(2, '0')} / ${String(total).padStart(2, '0')}`));
      const layout = add(frame, node('div', 'layout'));
      const copy = add(layout, node('div', 'copy'));
      add(copy, node('h2', 'reveal', value.title));
      if (value.body) add(copy, node('p', 'body reveal', value.body));
      add(copy, node('div', 'accent-rule reveal'));
      const visual = add(layout, node('div', 'visual'));
      add(visual, visualFor(value) || node('div', 'analogy reveal', story.summary));
      add(visual, evidence(value.evidence));
      return section;
    }

    function closingSlide(total) {
      const closing = story.closing || {};
      const section = node('section', 'slide closing-slide theme-mint');
      section.setAttribute('aria-label', closing.title || 'The takeaway');
      const frame = add(section, node('div', 'frame'));
      const top = add(frame, node('header', 'topline'));
      add(top, node('div', 'eyebrow', 'THE TAKEAWAY'));
      add(top, node('div', 'page', `${String(total).padStart(2, '0')} / ${String(total).padStart(2, '0')}`));
      const layout = add(frame, node('div', 'closing-layout'));
      const copy = add(layout, node('div', ''));
      add(copy, node('h2', 'closing-title reveal', closing.title || story.title));
      add(copy, node('p', 'body reveal', closing.body || story.summary));
      const visual = add(layout, node('div', ''));
      add(visual, bullets(closing.next_steps || ['The project is verified and ready for its intended use.'], 'next-list'));
      return section;
    }

    /* === DECK CONTROLLER === */
    const total = story.slides.length + 2;
    add(stage, titleSlide());
    story.slides.forEach((slide, index) => add(stage, contentSlide(slide, index, total)));
    add(stage, closingSlide(total));

    class Deck {
      constructor() {
        this.slides = [...document.querySelectorAll('.slide')];
        this.index = 0;
        this.touchStart = null;
        this.wheelLocked = false;
        this.bind();
        this.scale();
        this.show(0);
      }
      bind() {
        document.getElementById('previous').addEventListener('click', () => this.show(this.index - 1));
        document.getElementById('next').addEventListener('click', () => this.show(this.index + 1));
        window.addEventListener('resize', () => this.scale());
        document.addEventListener('keydown', event => {
          if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); this.show(this.index + 1); }
          if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(event.key)) { event.preventDefault(); this.show(this.index - 1); }
          if (event.key === 'Home') this.show(0);
          if (event.key === 'End') this.show(this.slides.length - 1);
        });
        document.addEventListener('wheel', event => {
          if (this.wheelLocked || Math.abs(event.deltaY) < 20) return;
          this.wheelLocked = true;
          this.show(this.index + (event.deltaY > 0 ? 1 : -1));
          window.setTimeout(() => { this.wheelLocked = false; }, 450);
        }, { passive: true });
        document.addEventListener('touchstart', event => { this.touchStart = event.changedTouches[0].clientX; }, { passive: true });
        document.addEventListener('touchend', event => {
          if (this.touchStart === null) return;
          const delta = event.changedTouches[0].clientX - this.touchStart;
          if (Math.abs(delta) > 55) this.show(this.index + (delta < 0 ? 1 : -1));
          this.touchStart = null;
        }, { passive: true });
      }
      scale() {
        const factor = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        const x = (window.innerWidth - 1920 * factor) / 2;
        const y = (window.innerHeight - 1080 * factor) / 2;
        stage.style.transform = `translate(${x}px, ${y}px) scale(${factor})`;
      }
      show(next) {
        this.index = Math.max(0, Math.min(next, this.slides.length - 1));
        this.slides.forEach((slide, index) => {
          slide.classList.toggle('active', index === this.index);
          slide.classList.toggle('visible', index === this.index);
          slide.setAttribute('aria-hidden', index === this.index ? 'false' : 'true');
        });
        document.getElementById('counter').textContent = `${this.index + 1} / ${this.slides.length}`;
        document.getElementById('progress').style.width = `${((this.index + 1) / this.slides.length) * 100}%`;
        document.title = `${story.title} — ${this.index + 1}/${this.slides.length}`;
      }
    }
    new Deck();
  </script>
</body>
</html>
