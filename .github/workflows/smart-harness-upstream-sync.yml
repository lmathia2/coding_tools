name: Smart Harness Upstream Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 15 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update upstream locks and synchronized manifests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 smart-harness/scripts/check-upstreams.py --update

      - name: Regenerate documentation
        run: python3 smart-harness/scripts/generate-reference.py

      - name: Validate generated change
        run: python3 smart-harness/scripts/validate-harness.py

      - name: Open or update review PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No upstream changes"
            exit 0
          fi

          branch="automation/smart-harness-upstreams"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add smart-harness/integrations/upstreams.lock.json \
                  smart-harness/pi/extensions.json \
                  smart-harness/pi/skills.json \
                  smart-harness/docs/REFERENCE.md
          git commit -m "chore: update Smart Harness upstream locks"
          git push --force origin "$branch"

          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr edit "$branch" \
              --title "chore: update Smart Harness upstream locks" \
              --body "Automated pinned-upstream update. Review upstream changes before merging because skills and extensions can execute with developer permissions."
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: update Smart Harness upstream locks" \
              --body "Automated pinned-upstream update. Review upstream changes before merging because skills and extensions can execute with developer permissions."
          fi
